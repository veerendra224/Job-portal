{% extends "base.html" %}
{% block title %}Apply for {{ job.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Apply for {{ job.title }}</h4>
            </div>
            <div class="card-body">
                <div class="mb-4">
                    <h5>{{ job.company }}</h5>
                    <p><i class="bi bi-geo-alt"></i> {{ job.location }}</p>
                </div>
                
                <form method="POST" action="">
                    <div class="mb-3">
                        <label for="cover_letter" class="form-label">Cover Letter</label>
                        <textarea class="form-control" id="cover_letter" name="cover_letter" rows="8" required></textarea>
                        <small class="text-muted">Explain why you're a good fit for this position</small>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('main.job_details', job_id=job.id) }}" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Submit Application</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
